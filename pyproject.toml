[project]
name = "pralert"
version = "0.1.0"
description = "Simulation-first disaster evidence and incident intelligence prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "httpx2>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

